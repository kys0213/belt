[package]
name = "belt-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "CLI interface for Belt"

[[bin]]
name = "belt"
path = "src/main.rs"

[dependencies]
belt-core = { workspace = true }
belt-infra = { workspace = true }
belt-daemon = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
anyhow = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
chrono = { workspace = true }
dirs = "6"
ratatui = { workspace = true }
crossterm = { workspace = true }
tempfile = { workspace = true }

# Fake-environment E2E: the test binary doubles as the fake `gh` / `claude`
# (dispatched on argv[0] through symlinks), so it needs its own `main`.
[[test]]
name = "e2e_fake"
path = "tests/e2e_fake/main.rs"
harness = false

[dev-dependencies]
async-trait = { workspace = true }
rusqlite = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt"] }
belt-infra = { workspace = true, features = ["test-support"] }
